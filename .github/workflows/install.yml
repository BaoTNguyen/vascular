name: install

# Does a stranger's clone work? Each repo's own CI tests dev work against
# sibling source checkouts. This tests what the READMEs tell a new user to do,
# from GitHub, on a bare runner: no Postgres, no GPU, no docker.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # the repos' mains move without telling this one
  workflow_dispatch:

jobs:
  umbrella:
    name: umbrella (${{ matrix.pins }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]   # 3.11 is plexus's floor (tomllib)
        # pinned: what `clone --recursive` hands out today.
        # latest: what it would hand out after the next bump.
        pins: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: matrix.pins == 'latest'
        run: git submodule update --remote
      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: ${{ matrix.python }}
      # vascular_paths.py is vendored verbatim into every repo and its docstring
      # promises this check. Copies that drift would put state in two places.
      # ponytail: latest only -- today's pins predate the module entirely. Drop
      # the `if` once the submodule pins are bumped past phase 1.
      - name: vendored vascular_paths is identical everywhere
        if: matrix.pins == 'latest'
        run: |
          sha256sum heart/src/heart/vascular_paths.py plexus/src/plexus/vascular_paths.py \
            arteries/src/arteries/vascular_paths.py capillaries/src/capillaries/vascular_paths.py \
            marrow/marrow/vascular_paths.py | tee hashes.txt
          [ "$(cut -d' ' -f1 hashes.txt | sort -u | wc -l)" = 1 ] || { echo "::error::vascular_paths.py copies differ"; exit 1; }
      # pulse owns the event contract: its emitter and envelope are vendored
      # verbatim into each Python emitter, and its path cases bind every
      # vascular_paths (the copies above are identical, so one stands for all).
      - name: vendored pulse contract matches pulse
        if: matrix.pins == 'latest'
        run: |
          same() { sha256sum "$@" | tee /dev/stderr | cut -d' ' -f1 | sort -u | wc -l | grep -qx 1 || { echo "::error::copies of $1 differ"; exit 1; }; }
          same pulse/emitters/python/pulse_emit.py heart/src/heart/pulse_emit.py \
            arteries/src/arteries/pulse_emit.py capillaries/src/capillaries/pulse_emit.py
          same pulse/contract/envelope.json heart/tests/pulse_envelope.json \
            arteries/tests/pulse_envelope.json capillaries/tests/pulse_envelope.json
          python3 pulse/emitters/python/test_paths_vectors.py heart/src/heart/vascular_paths.py
      # The README quick start: each repo syncs its own .venv, siblings via ../
      # pulse is design-only: it joins this loop and the standalone matrix
      # below with its first test suite.
      - name: every suite
        run: |
          status=0
          run() { echo "::group::$1"; (cd "$1" && eval "$2") || { echo "::error::$1 failed"; status=1; }; echo "::endgroup::"; }
          for r in heart plexus arteries capillaries; do run "$r" "uv sync && uv run pytest -q"; done
          run marrow "uv run --only-group dev pytest -q"
          exit $status
      # pulse is Rust. Same toolchain as the verifier image (verifier.Dockerfile);
      # bump both together. Runners ship rustup, so no third-party action.
      # Does nothing until pulse has a crate; --locked because the lockfile is
      # committed and the verifier can't write one.
      - name: pulse (Rust)
        run: |
          [ -f pulse/Cargo.toml ] || { echo "pulse has no crate yet"; exit 0; }
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          cd pulse && cargo test --locked

  roundtrip:
    # TREE_PLAN phase 6: install -> emit -> collect -> uninstall, then assert
    # nothing is left outside the kinds uninstall keeps, and that the spool
    # was drained into pulse before it went.
    name: uninstall round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      VASCULAR_HOME: /tmp/vh
      PULSE_DATABASE_URL: host=localhost user=postgres dbname=pulse
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: pulse
        run: |
          rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
          cargo build --release --locked --manifest-path pulse/Cargo.toml
          echo "$PWD/pulse/target/release" >> "$GITHUB_PATH"
      - name: install and emit
        run: |
          mkdir -p $VASCULAR_HOME/config/heart $VASCULAR_HOME/secrets/heart $VASCULAR_HOME/log/heart \
                   $VASCULAR_HOME/cache/heart/ws $VASCULAR_HOME/backups/arteries
          echo '{}' > $VASCULAR_HOME/config/heart/models.json
          echo seed > $VASCULAR_HOME/secrets/heart/sentinel
          echo line > $VASCULAR_HOME/log/heart/egress.log
          cd pulse/emitters/python && python3 -c "
          import os, pulse_emit; from pathlib import Path
          h = Path(os.environ['VASCULAR_HOME']); j = h / 'spool' / 'events'
          for i in range(25):
              pulse_emit.emit('probe', 'roundtrip.test', j, h / 'state' / 'pulse' / 'contexts', payload={'i': i})
          assert pulse_emit.artifact(b'round trip blob', j)"
      - name: uninstall keeps config, backups, secrets, data; drains the spool first
        run: |
          python3 uninstall.py --yes
          [ "$(ls $VASCULAR_HOME | tr '\n' ' ')" = "backups config data secrets " ] || { ls -la $VASCULAR_HOME; exit 1; }
          [ "$(psql "$PULSE_DATABASE_URL" -Atc "select count(*) from events where kind='roundtrip.test'")" = 25 ]
          [ "$(psql "$PULSE_DATABASE_URL" -Atc "select count(*) from artifacts")" = 1 ]
      - name: --purge --drop-data leaves config and backups, with a dump
        run: |
          python3 uninstall.py --yes --purge --drop-data
          [ "$(ls $VASCULAR_HOME | tr '\n' ' ')" = "backups config " ] || { ls -laR $VASCULAR_HOME; exit 1; }
          pg_restore -l $VASCULAR_HOME/backups/pulse/*.dump | grep -q "TABLE DATA public events"
          [ "$(psql "$PULSE_DATABASE_URL" -Atc "select count(*) from pg_tables where schemaname='public'")" = 0 ]

  standalone:
    name: ${{ matrix.repo }} + [${{ matrix.siblings }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README's "needs beside it" column. Only these siblings get cloned,
        # so a repo that grows a new sibling dependency goes red here until the
        # table (and this list) say so.
        include:
          - { repo: heart,       siblings: "" }
          - { repo: capillaries, siblings: "" }
          - { repo: plexus,      siblings: heart }
          - { repo: arteries,    siblings: capillaries }
          # training deps (torch, bitsandbytes) aren't reachable from the suite
          - { repo: marrow,      siblings: heart, test: "uv run --only-group dev pytest -q" }
    steps:
      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: "3.12"
      - name: clone from GitHub, as a stranger would
        run: |
          for r in ${{ matrix.repo }} ${{ matrix.siblings }}; do
            git clone --depth 1 "https://github.com/BaoTNguyen/$r"
          done
      - working-directory: ${{ matrix.repo }}
        run: ${{ matrix.test || 'uv sync && uv run pytest -q' }}

  bump:
    # The CD half: pins follow each repo's main, once that main has passed both
    # jobs above. Pushes made with GITHUB_TOKEN don't retrigger this workflow.
    needs: [umbrella, standalone, roundtrip]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # ponytail: bumps to main's tip *now*, which can be a commit newer than
      # the one tested if a repo pushed mid-run; the next scheduled run tests it.
      # Pass the tested SHAs between jobs if that window ever bites.
      - run: |
          git submodule update --remote
          git diff --quiet && { echo "pins already current"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump the stack to each repo's latest main"
          git push
